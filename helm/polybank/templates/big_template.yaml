apiVersion: v1
kind: ConfigMap
metadata:
  name: polybank-config
  namespace: {{ .Release.Namespace }}
data:
  SPRING_APPLICATION_NAME: polybank
  SERVER_PORT: {{ .Values.appServicePort | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

  {{- range $key, $var := .Values.appVars }}
  {{- if not $var.secret }}
  {{ $key }}: {{ required (printf "Set .Values.appVars.%s.value" $key) $var.value | quote }}
  {{- end }}
  {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: polybank-app
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: polybank
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.appName }}
  ports:
    - name: http
      port: {{ .Values.appServicePort }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-{{ .Values.appName }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  replicas: {{ .Values.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metricsContainerPort }}"
        prometheus.io/path: "/metrics"
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      {{- $pgHost := "" }}
      {{- $pgPort := 5432 }}
      {{- if .Values.postgresql.enabled }}
      {{- if eq (.Values.postgresql.architecture | default "standalone") "replication" }}
      {{- $pgHost = printf "%s-postgresql-primary" .Release.Name }}
      {{- else }}
      {{- $pgHost = printf "%s-postgresql" .Release.Name }}
      {{- end }}
      {{- else }}
      {{- $pgHost = .Values.externalPostgres.host }}
      {{- $pgPort = .Values.externalPostgres.port | default 5432 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until pg_isready -h {{ $pgHost }} -p {{ $pgPort }} -U "$POSTGRES_USER" -d "$POSTGRES_DB";
              do echo "waiting for postgres"; sleep 2; done
          envFrom:
            - secretRef:
                name: polybank-backend-secret
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "32Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "64Mi"
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | default 3 }}
            successThreshold: 1
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 30 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 5
          resources:
            requests:
              memory: "{{ .Values.resources.requests.memory }}"
              cpu: "{{ .Values.resources.requests.cpu }}"
              ephemeral-storage: "256Mi"
            limits:
              memory: "{{ .Values.resources.limits.memory }}"
              cpu: "{{ .Values.resources.limits.cpu }}"
              ephemeral-storage: "512Mi"
          envFrom:
            - secretRef:
                name: polybank-backend-secret
            - configMapRef:
                name: polybank-config
          ports:
            - name: http
              containerPort: {{ .Values.appServicePort }}
            - name: metrics
              containerPort: {{ .Values.metricsContainerPort }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.appName }}
                topologyKey: kubernetes.io/hostname