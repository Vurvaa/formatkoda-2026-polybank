apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-{{ .Values.notification.appName }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.notification.appName }}
  replicas: {{ .Values.notification.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.notification.appName }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      {{- $pgHost := "" }}
      {{- $pgPort := 5432 }}
      {{- if .Values.cnpg.enabled }}
      {{- $pgHost = printf "%s-pg-rw" .Release.Name }}
      {{- else }}
      {{- $pgHost = .Values.externalPostgres.host }}
      {{- $pgPort = .Values.externalPostgres.port | default 5432 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until pg_isready -h {{ $pgHost }} -p {{ $pgPort }} -U "$POSTGRES_USER" -d "$POSTGRES_DB";
              do echo "waiting for postgres"; sleep 2; done
          envFrom:
            - secretRef:
                name: polybank-backend-secret
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "32Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "64Mi"
      containers:
        - name: {{ .Values.notification.appName }}
          image: {{ .Values.notification.image.repository }}:{{ .Values.notification.image.tag }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.notification.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.notification.startupProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.notification.startupProbe.timeoutSeconds | default 3 }}
            successThreshold: 1
            failureThreshold: {{ .Values.notification.startupProbe.failureThreshold | default 30 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.notification.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.notification.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.notification.readinessProbe.timeoutSeconds | default 3 }}
            successThreshold: 1
            failureThreshold: {{ .Values.notification.readinessProbe.failureThreshold | default 3 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.notification.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.notification.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.notification.livenessProbe.timeoutSeconds | default 3 }}
            successThreshold: 1
            failureThreshold: {{ .Values.notification.livenessProbe.failureThreshold | default 5 }}
          resources:
            requests:
              memory: "{{ .Values.notification.resources.requests.memory }}"
              cpu: "{{ .Values.notification.resources.requests.cpu }}"
              ephemeral-storage: "256Mi"
            limits:
              memory: "{{ .Values.notification.resources.limits.memory }}"
              cpu: "{{ .Values.notification.resources.limits.cpu }}"
              ephemeral-storage: "512Mi"
          envFrom:
            - secretRef:
                name: polybank-backend-secret
            - configMapRef:
                name: polybank-notification-config
          ports:
            - name: http
              containerPort: {{ .Values.notification.appServicePort }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.notification.appName }}
                topologyKey: kubernetes.io/hostname
