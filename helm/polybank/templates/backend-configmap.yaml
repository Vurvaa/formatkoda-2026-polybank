apiVersion: v1
kind: ConfigMap
metadata:
  name: polybank-config
  namespace: {{ .Release.Namespace }}
data:
  SPRING_APPLICATION_NAME: polybank
  SERVER_PORT: {{ .Values.appServicePort | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

  APP_JWT_EXPIRATION_MINUTES: {{ .Values.appVars.appJwtExpirationMinutes | quote }}
  APP_CORS_ALLOWED_ORIGIN: {{ .Values.appVars.appCorsAllowedOrigin | quote }}
