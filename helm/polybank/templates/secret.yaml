apiVersion: v1
kind: Secret
metadata:
  name: polybank-backend-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
  {{ $username := required "Set .Values.postgresAuth.username" .Values.postgresAuth.username }}
  {{ $password := required "Set .Values.postgresAuth.password" .Values.postgresAuth.password }}
  {{ $postgresPassword := required "Set .Values.postgresAuth.postgresPassword" .Values.postgresAuth.postgresPassword }}
  {{ $database := required "Set .Values.postgresAuth.database" .Values.postgresAuth.database }}
stringData:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  postgres-password: {{ $postgresPassword | quote }}
  database: {{ $database | quote }}
  {{- if .Values.postgresql.enabled }}
  replication-password: {{ .Values.postgresAuth.replicationPassword | default $postgresPassword | quote }}
  {{- end }}

  POSTGRES_USER: {{ $username | quote }}
  POSTGRES_DB: {{ $database | quote }}

  {{ $pgHost := .Values.postgresql.enabled | ternary (printf "%s-postgresql" .Release.Name) (required "Set .Values.externalPostgres.host" .Values.externalPostgres.host) }}
  {{ $pgPort := .Values.postgresql.enabled | ternary 5432 (.Values.externalPostgres.port | default 5432) }}
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ $pgHost }}:{{ $pgPort }}/{{ $database }}"
  SPRING_DATASOURCE_USERNAME: {{ $username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ $password | quote }}

  {{- range $key, $var := .Values.appVars }}
  {{- if $var.secret }}
  {{ $key }}: {{ required (printf "Set .Values.appVars.%s.value" $key) $var.value | quote }}
  {{- end }}
  {{- end }}
