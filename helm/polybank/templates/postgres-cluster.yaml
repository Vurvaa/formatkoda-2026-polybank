apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.cnpg.instances }}

  bootstrap:
    initdb:
      database: {{ .Values.postgresAuth.database | quote }}
      owner: {{ .Values.postgresAuth.username | quote }}
      secret:
        name: {{ .Release.Name }}-pg-app-secret

  storage:
    size: {{ .Values.cnpg.storageSize }}
    storageClass: {{ .Values.cnpg.storageClass }}

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: {{ .Values.cnpg.resources.requests.cpu }}
      memory: {{ .Values.cnpg.resources.requests.memory }}
    limits:
      cpu: {{ .Values.cnpg.resources.limits.cpu }}
      memory: {{ .Values.cnpg.resources.limits.memory }}

  postgresql:
    parameters:
      max_connections: "100"

  monitoring:
    enablePodMonitor: false
