apiVersion: v1
kind: ConfigMap
metadata:
  name: polybank-webapp-nginx
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
        listen {{ .Values.webapp.containerPort }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://polybank-app:{{ .Values.appServicePort }}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri /index.html;
        }
    }

---

apiVersion: v1
kind: Service
metadata:
  name: polybank-webapp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: polybank
    app.kubernetes.io/component: webapp
spec:
  type: {{ .Values.webapp.service.type }}
  selector:
    app: {{ .Values.webapp.appName }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.webapp.service.type "NodePort") .Values.webapp.service.nodePort }}
      nodePort: {{ .Values.webapp.service.nodePort }}
      {{- end }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-{{ .Values.webapp.appName }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.webapp.appName }}
  replicas: {{ .Values.webapp.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.appName }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Values.webapp.appName }}
          image: {{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 5
          resources:
            requests:
              memory: "{{ .Values.webapp.resources.requests.memory }}"
              cpu: "{{ .Values.webapp.resources.requests.cpu }}"
              ephemeral-storage: "64Mi"
            limits:
              memory: "{{ .Values.webapp.resources.limits.memory }}"
              cpu: "{{ .Values.webapp.resources.limits.cpu }}"
              ephemeral-storage: "128Mi"
          ports:
            - name: http
              containerPort: {{ .Values.webapp.containerPort }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: polybank-webapp-nginx
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.webapp.appName }}
                topologyKey: kubernetes.io/hostname