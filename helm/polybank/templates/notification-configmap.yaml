apiVersion: v1
kind: ConfigMap
metadata:
  name: polybank-notification-config
  namespace: {{ .Release.Namespace }}
data:
  SPRING_APPLICATION_NAME: notification
  SERVER_PORT: {{ .Values.notification.appServicePort | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ required "Set .Values.notification.kafka.bootstrapServers" .Values.notification.kafka.bootstrapServers | quote }}
  SPRING_MAIL_HOST: {{ .Values.notification.mail.host | default "192.168.130.81" | quote }}
  SPRING_MAIL_PORT: {{ .Values.notification.mail.port | default 1025 | quote }}
