namespace: polybank
appName: polybank-backend
image:
  repository: 192.168.130.81:5000/polybank
  tag: latest
replicas: 2
appServicePort: 8080
metricsContainerPort: 5300
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

postgresql:
  enabled: true
  auth:
    existingSecret: "polybank-backend-secret"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      usernameKey: username
      databaseKey: database
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "local-path"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"