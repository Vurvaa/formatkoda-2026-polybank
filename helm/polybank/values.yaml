namespace: polybank
appName: polybank-backend
image:
  repository: 192.168.130.81:5000/polybank
  tag: latest
replicas: 3
appServicePort: 8080
metricsContainerPort: 5300
service:
  type: NodePort
  nodePort: 30090
ingress:
  enabled: false
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

postgresAuth:
  username: polybank_user
  password: ""
  postgresPassword: ""
  database: polybank_db

configEnv:
  APP_JWT_EXPIRATION_MINUTES: "60"
  APP_CORS_ALLOWED_ORIGIN: "http://192.168.130.82:30091,http://192.168.130.83:30091,http://192.168.130.84:30091"

secretEnv:
  APP_JWT_SECRET: ""

webapp:
  appName: polybank-webapp
  image:
    repository: 192.168.130.81:5000/polybank-webapp
    tag: latest
  replicas: 2
  containerPort: 80
  service:
    type: NodePort
    nodePort: 30091
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

postgresql:
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: polybank_user
    database: polybank_db
    existingSecret: "polybank-backend-secret"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      usernameKey: username
      databaseKey: database
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "local-path"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"