namespace: polybank-test
appName: polybank-backend
replicas: 1
image:
  repository: 192.168.130.81:5000/polybank-test
  tag: latest
service:
  type: NodePort
  nodePort: 30190
resources:
  requests:
    memory: "384Mi"
    cpu: "200m"
  limits:
    memory: "768Mi"
    cpu: "750m"

startupProbe:
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 40

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 5

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

webapp:
  appName: polybank-webapp
  replicas: 1
  image:
    repository: 192.168.130.81:5000/polybank-webapp-test
    tag: latest
  service:
    type: NodePort
    nodePort: 30191
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"

appVars:
  appCorsAllowedOrigin: "http://192.168.130.82:30191,http://192.168.130.83:30191,http://192.168.130.84:30191"

postgresql:
  host: polybank-pg-rw
  port: 5432

redis:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "150m"

ingress:
  pathPrefix: "/test"
  webappEnabled: true

cnpg:
  instances: 1
  storageSize: 2Gi
  storageClass: "local-path"
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      cpu: "200m"
      memory: "1Gi"

resourceQuota:
  maxPods: "25"
  requestsCpu: "2"
  requestsMemory: "4Gi"
  limitsCpu: "5"
  limitsMemory: "8Gi"

postgresAuth:
  username: polybank_test_user
  database: polybank_test_db

trafficGenerator:
  appName: polybank-traffic-generator
  image:
    repository: 192.168.130.81:5000/polybank-traffic-generator
    tag: latest
  replicas: 1
  containerPort: 6060
  service:
    type: NodePort
    nodePort: 30193
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

notification:
  appName: polybank-notification
  replicas: 1
  image:
    repository: 192.168.130.81:5000/polybank-notification-test
    tag: latest
  service:
    type: NodePort
    nodePort: 30192
  resources:
    requests:
      memory: "192Mi"
      cpu: "75m"
    limits:
      memory: "384Mi"
      cpu: "200m"
  startupProbe:
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 40
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  kafka:
    bootstrapServers: "192.168.130.82:9092"
  mail:
    host: "192.168.130.81"
    port: 1025
