namespace: polybank-test
appName: polybank-backend
replicas: 1

image:
  repository: 192.168.130.81:5000/polybank-test
  tag: latest

service:
  type: NodePort
  nodePort: 30190

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "254Mi"
    cpu: "100m"

startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 40

webapp:
  appName: polybank-webapp
  replicas: 1
  image:
    repository: 192.168.130.81:5000/polybank-webapp-test
    tag: latest
  service:
    type: NodePort
    nodePort: 30191
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"

appVars:
  APP_CORS_ALLOWED_ORIGIN:
    secret: false
    value: "http://192.168.130.82:30191,http://192.168.130.83:30191,http://192.168.130.84:30191"

postgresql:
  enabled: true
  architecture: replication
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: polybank_test_user
    database: polybank_test_db
    existingSecret: "polybank-backend-secret"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      usernameKey: username
      databaseKey: database
      replicationPasswordKey: replication-password
  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: "local-path"
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
    podAntiAffinityPreset: hard
  readReplicas:
    replicaCount: 1
    persistence:
      enabled: true
      size: 2Gi
      storageClass: "local-path"
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    podAntiAffinityPreset: hard

postgresAuth:
  username: polybank_test_user
  database: polybank_test_db
