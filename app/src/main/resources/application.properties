spring.application.name=polybank
spring.config.import=optional:file:.env[.properties]

server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/polybank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:polybank_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173,http://localhost:3000}
management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=polybank

spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USER:default}
spring.data.redis.password=${REDIS_PASSWORD}

ratelimit.enabled=true
dummy-controller.enabled=true
