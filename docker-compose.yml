services:
  postgres:
    image: postgres:16-alpine
    container_name: polybank-postgres
    environment:
      POSTGRES_DB: polybank_db
      POSTGRES_USER: polybank_user
      POSTGRES_PASSWORD: polybank_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polybank_user -d polybank_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
