services:

  postgres:
    image: postgres:16-alpine
    container_name: polybank-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - polybank-net

  polybank:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        POSTGRES_DB: ${POSTGRES_DB}_codegen
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    image: polybank-local:latest
    container_name: polybank-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS:                  ${JAVA_OPTS:-}
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - polybank-net

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: polybank-webapp-local:latest
    container_name: polybank-webapp
    restart: unless-stopped
    depends_on:
      polybank:
        condition: service_healthy
    ports:
      - "${WEBAPP_PORT:-3000}:80"
    networks:
      - polybank-net

volumes:
  postgres-data:

networks:
  polybank-net:
    driver: bridge